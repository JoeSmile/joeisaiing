baseURL = "https://joesmile.github.io/"
theme = "FixIt"
title = "SmileJoe"
defaultContentLanguage = "zh-cn"
[languages.zh-cn]
locale = "zh-CN"
label = "简体中文"
weight = 1
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks.page]
posts = "/:slug.html"

[taxonomies]
category = "categories"
tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = true
noClasses = false

[params]
description = "Joe 的技术博客"
dateFormat = "2006-01-02"
[params.author]
name = "Joe"
email = ""
link = "https://github.com/JoeSmile"
[params.header.title]
name = "SmileJoe"
logo = "/images/avatar.jpeg"
[params.home.profile]
enable = true
title = "SmileJoe"
subtitle = "To be or not to be"
[params.home.posts]
enable = true
[params.page]
hiddenFromHomePage = false
hiddenFromSearch = false
[params.page.code]
copy = true
[params.page.code.mermaid]
enable = true
[params.mermaid]
wrapper = true
securityLevel = "loose"
[params.search]
enable = true
type = "fuse"
[params.social]
[params.social.github]
id = "JoeSmile"

[[menus.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 1
[menus.main.params]
icon = "fa-solid fa-archive"

[[menus.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 2
[menus.main.params]
icon = "fa-solid fa-folder-tree"

[[menus.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 3
[menus.main.params]
icon = "fa-solid fa-tags"

[[menus.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 4
[menus.main.params]
icon = "fa-solid fa-user"
