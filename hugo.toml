baseURL = "https://joesmile.github.io/"
theme = "FixIt"
title = "JoeSmile"
defaultContentLanguage = "zh-cn"
[languages.zh-cn]
locale = "zh-CN"
label = "简体中文"
weight = 1
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[outputs]
home = ["HTML", "RSS", "search", "archives"]

[permalinks.page]
posts = "/:slug.html"

[taxonomies]
category = "categories"
tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = true
noClasses = false

[params]
description = "Joe 的技术博客 — AI Agent应用全链路工程实践"
dateFormat = "2006-01-02"
summaryLength = 120
disableThemeInject = true
[params.author]
name = "Joe"
email = ""
link = "https://github.com/JoeSmile"
avatar = "/images/avatar.jpeg"
[params.header.title]
name = "JoeSmile"
logo = "/images/avatar.jpeg"
[params.header.subtitle]
name = ""
typeit = false
[params.home.profile]
enable = true
title = "JoeSmile"
subtitle = ""
typeit = false
avatarURL = "/images/avatar.jpeg"
social = false
[params.home.posts]
enable = true
paginate = 8
[params.page]
_merge = "shallow"
hiddenFromHomePage = false
hiddenFromSearch = false
capitalizeTitles = false
summaryPlainify = true
[params.page.code]
copy = true
[params.page.code.mermaid]
enable = true
[params.page.share]
enable = false
[params.mermaid]
wrapper = true
securityLevel = "loose"
[params.search]
enable = true
type = "fuse"
placeholder = "搜索文章标题或内容…"
[params.archives]
paginate = 30
dateFormat = "01-02"

[params.search.fuse]
isCaseSensitive = false
minMatchCharLength = 1
findAllMatches = true
ignoreLocation = true
threshold = 0.4
distance = 1000
[params.social]
[params.social.github]
id = "JoeSmile"

[params.app]
title = "JoeSmile"
svgFavicon = "/images/avatar.jpeg"
iconColor = "#5bbad5"
tileColor = "#252627"

[params.footer.powered]
enable = false

[params.cookieconsent]
enable = false

[[menus.main]]
identifier = "archive-legacy"
name = "历史归档"
url = "/categories/归档/"
weight = 1
[menus.main.params]
icon = "fa-solid fa-box-archive"

[[menus.main]]
identifier = "archives-year"
name = "按年归档"
url = "/archives/"
weight = 2
[menus.main.params]
icon = "fa-solid fa-calendar-days"

[[menus.main]]
identifier = "archives"
name = "全部文章"
url = "/posts/"
weight = 3
[menus.main.params]
icon = "fa-solid fa-archive"

[[menus.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 4
[menus.main.params]
icon = "fa-solid fa-folder-tree"

[[menus.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 5
[menus.main.params]
icon = "fa-solid fa-tags"

[[menus.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 6
[menus.main.params]
icon = "fa-solid fa-user"
